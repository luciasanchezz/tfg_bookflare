{% extends "base.html" %}
{% block content %}
<div class="auth">
    <div class="auth__card">
        <h2>Nueva contraseña</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn--primary btn--block">
                Cambiar contraseña
            </button>
        </form>
    </div>
</div>
{% endblock %}
