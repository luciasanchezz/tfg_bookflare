{% extends "base.html" %}
{% block title %}Restablecer contraseña{% endblock %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <h2>Restablecer contraseña</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn--primary btn--block">
                Enviar enlace
            </button>
        </form>
    </div>
</div>
{% endblock %}
