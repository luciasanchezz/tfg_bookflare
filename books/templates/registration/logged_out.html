{% extends "books/base.html" %}

{% block title %}Sesión cerrada · BookFlare{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h1 class="h4 mb-2">Has cerrado sesión</h1>
                    <p class="text-muted mb-4">
                        Tu sesión se ha cerrado correctamente. Puedes volver a entrar cuando quieras.
                    </p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'login' %}" class="btn btn-primary">Iniciar sesión de nuevo</a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
