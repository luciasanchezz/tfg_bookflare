{% extends "base.html" %}
{% block title %}Añadir reseña{% endblock %}

{% block content %}

<div style="max-width:600px; margin:60px auto;">

    <h2>Valora el libro</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.rating }}

        <!-- ESTRELLAS SVG -->
        <div id="star-container" style="display:flex; gap:10px; cursor:pointer; margin:20px 0;">
            {% for i in "12345" %}
                <svg data-value="{{ i }}" width="45" height="45" viewBox="0 0 24 24" fill="#ccc">
                    <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.848 1.48 8.246L12 18.897l-7.416 4.503 1.48-8.246L0 9.306l8.332-1.151z"/>
                </svg>
            {% endfor %}
        </div>

        {% if form.errors %}
            <div style="color:red; margin-bottom:10px;">
                {{ form.rating.errors }}
            </div>
        {% endif %}

        <div>
            {{ form.comentario }}
        </div>

        <button type="submit" class="btn btn--primary" style="margin-top:20px;">
            Publicar reseña
        </button>
    </form>

</div>

<script>
const stars = document.querySelectorAll("#star-container svg");
const ratingInput = document.querySelector("input[name='rating']");

stars.forEach(star => {
    star.addEventListener("click", function() {
        const value = this.dataset.value;
        ratingInput.value = value;

        stars.forEach(s => {
            s.setAttribute("fill", s.dataset.value <= value ? "#f5b301" : "#ccc");
        });
    });
});
</script>

{% endblock %}
