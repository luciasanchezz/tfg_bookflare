{% extends "base.html" %}
{% block title %}Registro | BookFlare{% endblock %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <h1 class="auth__title">Crear cuenta</h1>
        <p class="auth__subtitle">Regístrate para acceder al catálogo y gestionar tus préstamos.</p>

        <form method="post" class="auth__form">
            {% csrf_token %}

            <div class="form">
                {{ form.as_p }}
            </div>

            <button class="btn btn--primary btn--block" type="submit">Registrarse</button>
        </form>
    </div>
</div>
{% endblock %}
