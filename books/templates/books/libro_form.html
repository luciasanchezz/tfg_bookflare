{% extends "base.html" %}
{% block title %}Crear libro | BookFlare{% endblock %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <h1 class="auth__title">Crear libro</h1>
        <p class="auth__subtitle">Rellena los datos del libro y sube la portada/archivo digital.</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form">
                {{ form.as_p }}
            </div>
            <button class="btn btn--success btn--block" type="submit">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
