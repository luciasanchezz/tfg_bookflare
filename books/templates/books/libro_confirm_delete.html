{% extends "base.html" %}
{% block title %}Eliminar libro | BookFlare{% endblock %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <h1 class="auth__title">Eliminar libro</h1>
        <p class="auth__subtitle">¿Seguro que quieres eliminar <strong>{{ object.titulo }}</strong>?</p>

        <form method="post">
        {% csrf_token %}
            <div class="btns">
                <button class="btn btn--outline-danger" type="submit">Sí, eliminar</button>
                <a class="btn btn--outline" href="{% url 'principal' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
